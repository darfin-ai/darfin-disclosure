services:
  - type: web
    name: darfin-disclosure
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8002
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PORT
        value: 8002
      - key: GEMINI_API_KEY
        sync: false
      - key: DART_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
